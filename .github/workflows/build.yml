name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all targets'
        type: boolean
        default: true
      create_release:
        description: 'Create a versioned release from this build'
        type: boolean
        default: false
      merge_request_id:
        type: string
        default: ''
      merge_request_url:
        type: string
        default: ''

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.47.7"
  APP_NAME: floof
  APP_ID: gitlab.httpanimations.floof
  PAGES_BASE: /floof/

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_all: ${{ steps.meta.outputs.build_all }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and build metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          BUILD_NUMBER=$(date +%s | cut -c4-10)
          if [ -n "${{ inputs.build_all }}" ]; then
            BUILD_ALL="${{ inputs.build_all }}"
          else
            BUILD_ALL="true"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install cocogitto
        run: |
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/cog.tar.gz -C /tmp
          sudo install -m 755 /tmp/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
      - name: Check commits
        run: |
          if git tag -l | grep -q .; then
            cog check
          else
            cog check "$(git rev-list --max-parents=0 HEAD)..HEAD"
          fi
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-pub
      - name: Coverage must be 100%
        run: |
          flutter test --coverage
          python3 - <<'PY'
          lf = lh = 0
          for line in open('coverage/lcov.info'):
              if line.startswith('LF:'): lf += int(line[3:])
              if line.startswith('LH:'): lh += int(line[3:])
          assert lf > 0 and lh == lf, f'coverage {lh}/{lf} is not 100%'
          print(f'coverage ok: {lh}/{lf}')
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: android, os: ubuntu-latest}
          - {target: linux, os: ubuntu-latest}
          - {target: windows, os: windows-latest}
          - {target: macos, os: macos-latest}
          - {target: ios, os: macos-latest}
          - {target: web, os: ubuntu-latest}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os != 'macOS' || matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Flutter from source (arm64 hosts)
        if: matrix.target == 'linux-arm64' || matrix.target == 'windows-arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm appstream flatpak-builder elfutils curl zip

      - name: Setup Android signing
        if: matrix.target == 'android'
        id: signing
        run: |
          SIGNING="debug"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/floof.jks"
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/floof.jks
          EOF
            SIGNING="release"
          fi
          echo "signing=$SIGNING" >> "$GITHUB_OUTPUT"
      - name: Build Android packages
        if: matrix.target == 'android'
        run: |
          flutter pub get
          if [ "${{ steps.signing.outputs.signing }}" = "release" ]; then
            flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
            flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          else
            flutter build apk --debug --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          fi
          mkdir -p artifacts
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk artifacts/floof-android.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk artifacts/floof-android-debug.apk
          fi
          [ -f build/app/outputs/bundle/release/app-release.aab ] && cp build/app/outputs/bundle/release/app-release.aab artifacts/floof-android.aab || true
      - name: Build Linux desktop packages
        if: matrix.target == 'linux' || matrix.target == 'linux-arm64'
        run: |
          set -euo pipefail
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          if [ "$(uname -m)" = "aarch64" ]; then
            LINUX_ARCH=arm64; OUT_ARCH=arm64; RPM_ARCH=aarch64
          else
            LINUX_ARCH=x64; OUT_ARCH=x86_64; RPM_ARCH=x86_64
          fi
          BUNDLE="build/linux/$LINUX_ARCH/release/bundle"
          mkdir -p artifacts
          tar -C "$BUNDLE" -czf "artifacts/floof-linux-$OUT_ARCH.tar.gz" .
          cd "$BUNDLE"
          zip -qr "$GITHUB_WORKSPACE/artifacts/floof-linux-$OUT_ARCH.zip" .
          cd "$GITHUB_WORKSPACE"
          ./scripts/build-deb.sh "$BUNDLE" "$VERSION" "$OUT_ARCH" "artifacts/floof-linux-$OUT_ARCH.deb"
          ./scripts/build-rpm.sh "$BUNDLE" "$VERSION" "$RPM_ARCH" "artifacts/floof-linux-$OUT_ARCH.rpm" "$BUILD_NUMBER"
      - name: Build AppImage
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          BUNDLE="build/linux/x64/release/bundle"
          APPIMAGETOOL=/tmp/appimagetool
          curl -fsSL -o "$APPIMAGETOOL" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$APPIMAGETOOL"
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -a "$BUNDLE/." AppDir/usr/bin/
          cp packaging/linux/floof.desktop AppDir/usr/share/applications/gitlab.httpanimations.floof.desktop
          cp assets/icon_512.png AppDir/usr/share/icons/hicolor/512x512/apps/gitlab.httpanimations.floof.png
          ln -sf usr/bin/floof AppDir/AppRun
          ln -sf usr/share/applications/gitlab.httpanimations.floof.desktop AppDir/gitlab.httpanimations.floof.desktop
          ln -sf usr/share/icons/hicolor/512x512/apps/gitlab.httpanimations.floof.png AppDir/gitlab.httpanimations.floof.png
          ARCH=x86_64 "$APPIMAGETOOL" AppDir artifacts/floof-linux-x86_64.AppImage
      - name: Build Flatpak
        if: matrix.target == 'linux' || matrix.target == 'linux-arm64'
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "aarch64" ]; then LINUX_ARCH=arm64; FP_ARCH=aarch64; else LINUX_ARCH=x64; FP_ARCH=x86_64; fi
          mkdir -p "$HOME/.gpg"
          echo "${{ secrets.FLATPAK_GPG_KEY }}" | base64 -d | gpg --batch --homedir "$HOME/.gpg" --import
          KEYID="${{ secrets.FLATPAK_GPG_KEY_ID }}"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak-builder --user --arch="$FP_ARCH" --repo=flatpak-repo-$FP_ARCH --force-clean build-dir packaging/flatpak/$APP_ID.yml
          flatpak build-update-repo --gpg-sign="$KEYID" --gpg-homedir="$HOME/.gpg" --generate-static-deltas flatpak-repo-$FP_ARCH
          mkdir -p flatpak-repo-flat
          rsync -a --delete "flatpak-repo-$FP_ARCH/" flatpak-repo-flat/ 2>/dev/null || cp -a "flatpak-repo-$FP_ARCH/." flatpak-repo-flat/
          mkdir -p artifacts
          tar -C flatpak-repo-flat -czf "artifacts/floof-flatpak-$FP_ARCH.tar.gz" .
          flatpak build-bundle "flatpak-repo-$FP_ARCH" "artifacts/floof-$FP_ARCH.flatpak" "$APP_ID"
      - name: Build Windows package
        if: matrix.target == 'windows' || matrix.target == 'windows-arm64'
        run: |
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release --build-name="$env:VERSION" --build-number="$env:BUILD_NUMBER"
          $arch = if ("${{ matrix.target }}" -eq "windows-arm64") { "arm64" } else { "x64" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "build/windows/$arch/runner/Release/*" -DestinationPath "artifacts/floof-windows-$arch.zip"
        shell: pwsh
      - name: Build macOS package
        if: matrix.target == 'macos'
        run: |
          flutter pub get
          flutter config --enable-macos-desktop
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/floof.app artifacts/floof-macos.zip
      - name: Build iOS package (unsigned)
        if: matrix.target == 'ios'
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts Payload
          cp -a build/ios/iphoneos/Runner.app Payload/
          zip -qr artifacts/floof-ios.ipa Payload
      - name: Build web app + assemble Pages
        if: matrix.target == 'web'
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web --release --base-href "${PAGES_BASE}app/" --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          mkdir -p artifacts/pages/app
          cp -a build/web/. artifacts/pages/app/
          cd landing
          flutter pub get
          flutter build web --release --base-href "$PAGES_BASE"
          cd ..
          cp -a landing/build/web/. artifacts/pages/
          mkdir -p artifacts/pages/flatpak
          [ -f flatpak/key.gpg ] && cp flatpak/key.gpg artifacts/pages/flatpak/ || true
          [ -f packaging/flatpak/floof.flatpakref ] && cp packaging/flatpak/floof.flatpakref artifacts/pages/ || true
          tar -C artifacts/pages -czf artifacts/floof-web.tar.gz .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            artifacts/
            !artifacts/pages/**
          retention-days: 400
      - name: Upload pages artifact
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: artifacts/pages/
          retention-days: 400
      - name: Upload flatpak repo artifact
        if: matrix.target == 'linux' || matrix.target == 'linux-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ matrix.target }}
          path: flatpak-repo-flat/
          retention-days: 400

  merge-flatpak:
    name: Merge flatpak repos into Pages
    needs: [setup, build]
    if: ${{ needs.setup.outputs.build_all == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download flatpak repo artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flatpak-repo-*
          path: fp-repos
      - name: Merge repos and sign
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak-builder ostree
          mkdir -p "$HOME/.gpg"
          ostree --repo=flatpak-merged init --mode=archive-z2
          echo "${{ secrets.FLATPAK_GPG_KEY }}" | base64 -d | gpg --batch --homedir "$HOME/.gpg" --import
          KEYID="${{ secrets.FLATPAK_GPG_KEY_ID }}"
          for d in fp-repos/*/; do
            mkdir -p "$d/refs/remotes"
            ostree --repo=flatpak-merged pull-local "$d"
          done
          flatpak build-update-repo --gpg-sign="$KEYID" --gpg-homedir="$HOME/.gpg" --generate-static-deltas flatpak-merged
          mkdir -p flatpak/key.gpg.d && gpg --export "$KEYID" > flatpak/key.gpg
          sed -e "s|@GPGKEY@|$(base64 -w0 flatpak/key.gpg)|" \
              -e "s|@URL@|https://httpanimations.gitlab.io/floof/flatpak|" \
              packaging/flatpak/floof.flatpakref.in > flatpak/floof.flatpakref
      - name: Upload merged flatpak repo
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-merged
          path: flatpak-merged/
          retention-days: 400

  release:
    name: Release
    needs: [setup, build, merge-flatpak]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-ops
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: meta
        run: echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Download flatpak repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-merged
          path: flatpak-merged
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -maxdepth 2 -type f \( -name 'floof-*' -o -name 'floof.*' \) -exec cp {} release-assets/ \;
          tar -C flatpak-merged -czf release-assets/floof-flatpak-repo.tar.gz . || true
          cp flatpak/floof.flatpakref release-assets/ || true
          cp flatpak/key.gpg release-assets/ || true
          ls release-assets/
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
      - name: Update altstore source
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          IPA="https://github.com/${{ github.repository }}/releases/download/$TAG/floof-ios.ipa"
          VERSION="${TAG#v}"
          python3 - "$VERSION" "$IPA" <<'PY'
          import json, sys, datetime
          version, ipa = sys.argv[1], sys.argv[2]
          src = {
            "name": "floof",
            "identifier": "gitlab.httpanimations.floof",
            "sourceURL": "https://gitlab.com/HttpAnimations/floof/-/raw/main/repos/altstore.json",
            "apps": [{
              "name": "floof",
              "bundleIdentifier": "gitlab.httpanimations.floof",
              "developerName": "HttpAnimations",
              "localizedDescription": "A video client for e926 with a local recommendation engine.",
              "iconURL": "https://gitlab.com/HttpAnimations/floof/-/raw/main/assets/icon_512.png",
              "tintColor": "FFB347",
              "versions": [{
                "version": version,
                "date": datetime.date.today().isoformat(),
                "downloadURL": ipa,
                "size": 0,
                "minOSVersion": "15.0"
              }],
              "appPermissions": {
                "photos": "Used to attach a photo when you mark a video as done.",
                "camera": [{"NSCameraUsageDescription": "Used to take a photo when you mark a video as done."}]
              }
            }]
          }
          open('repos/altstore.json', 'w').write(json.dumps(src, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos/altstore.json
          git diff --cached --quiet || git commit -m "chore: 更新 altstore 源 [skip ci]"
          git push || true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: floof ${{ steps.meta.outputs.release_tag }}
          body: |
            Release ${{ steps.meta.outputs.release_tag }} of floof.

            ### Verification
            SHA256 checksums are in `SHA256SUMS.txt`.
          prerelease: false
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          for file in release-assets/* SHA256SUMS.txt; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "$file" --clobber; then
                uploaded=true
                break
              fi
              sleep $((attempt * 15))
            done
            [ "$uploaded" = true ] || exit 1
          done

  gitlab-sync:
    name: Trigger GitLab sync
    runs-on: ubuntu-latest
    needs: [release]
    if: always() && needs.release.result == 'success'
    steps:
      - name: Trigger GitLab sync pipeline
        run: |
          curl -fsSL --max-time 30 --retry 2 -X POST \
            -F token="${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            -F "ref=main" \
            -F "variables[GITHUB_RUN_ID]=${{ github.run_id }}" \
            -F "variables[RELEASE_TAG]=${{ needs.release.outputs.release_tag }}" \
            "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
